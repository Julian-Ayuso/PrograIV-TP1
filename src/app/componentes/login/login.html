<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 350px;">
    <h3 class="text-center mb-4">Login</h3>

    <form>
      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input type="text" class="form-control" id="username" placeholder="Ingresá tu usuario">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="Ingresá tu contraseña">
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-3">
        Ingresar
      </button>
    </form>

    <div class="text-center">
      <p class="mb-2">Acceso rápido:</p>
      <div class="d-flex justify-content-between">
        <button class="btn btn-outline-secondary w-50 me-2">
          Invitado
        </button>
        <button class="btn btn-outline-success w-50">
          Admin
        </button>
      </div>
    </div>
  </div>
</div>
