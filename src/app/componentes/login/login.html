<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 350px;">
    <h3 class="text-center mb-4">Login</h3>

    <form>
      <div class="mb-3">
        <label for="username" class="form-label">Email</label>
        <input type="text" class="form-control" id="username" name="correoElectronico" [(ngModel)]="correoElectronico" placeholder="Ingresá tu Email">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="clave" [(ngModel)]="clave" placeholder="Ingresá tu contraseña">
      </div>

      <button type="submit" (click)="ingresar()" class="btn btn-primary w-100 mb-3">
        Ingresar
      </button>
    </form>

    <div class="text-center">
      <p class="mb-2">Acceso rápido:</p>
      <div class="d-flex justify-content-between">
        <button (click)="ingresoRapido()" class="btn btn-secondary w-100 mb-3">Ingreso Rápido</button>
      </div>
    </div>
  </div>
</div>

<button (click)="logout()">Cerrar Sesión</button>
