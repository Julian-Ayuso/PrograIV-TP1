<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 400px;">
    <h3 class="text-center mb-4">Registro</h3>

    <form>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name= "correoElectronico" [(ngModel)]="correoElectronico" placeholder="Ingresá tu email">
      </div>
      
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" name= "nombre" [(ngModel)]="nombre" placeholder="Ingresá tu nombre">
      </div>

      <div class="mb-3">
        <label for="apellido" class="form-label">Apellido</label>
        <input type="text" class="form-control" id="apellido" name= "apellido" [(ngModel)]="apellido" placeholder="Ingresá tu apellido">
      </div>

      <div class="mb-3">
        <label for="edad" class="form-label">Edad</label>
        <input type="integer" class="form-control" id="edad" name= "edad"[(ngModel)]="edad" placeholder="Ingresá tu edad">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="clave"[(ngModel)]="clave" placeholder="Creá una contraseña">
      </div>

      <div class="d-flex justify-content-between mt-4">
        <button (click)="registrarUsuario()" class="btn btn-success w-50 me-2">
          Enviar
        </button>
        <button type="button" class="btn btn-secondary w-50">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>

<div class="custom-backdrop" *ngIf='mensajeError'>
  <div class="modal d-block">
    <div class="modal-dialog">
      <div class="modal-content p-3">
        <h5>Error</h5>
        <p>{{ mensajeError }}</p>
        <button (click)="mensajeError=''">Cerrar</button>
      </div>
    </div>
  </div>
</div>
